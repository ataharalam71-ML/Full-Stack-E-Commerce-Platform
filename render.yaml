# Render Blueprint — deploys the site + API as ONE free web service.
# Use it with: Render dashboard -> New -> Blueprint -> pick this repo.
# Values marked "sync: false" are typed into the dashboard when you deploy.
services:
  - type: web
    name: dealdost
    runtime: node
    plan: free
    region: singapore # closest to India; change if your visitors are elsewhere
    buildCommand: npm run deploy:build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Generated once by Render — you never see or need it.
      - key: JWT_SECRET
        generateValue: true
      # Postgres connection string from https://neon.tech (free tier).
      # Required: the instance disk is wiped on every restart, so data cannot live on it.
      - key: DATABASE_URL
        sync: false
      # Your admin login. The first boot creates this account automatically.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Your public site URL, e.g. https://dealdost.onrender.com (used by sitemap.xml).
      - key: SITE_URL
        sync: false
      # Affiliate IDs - leave blank until approved, or set them in Admin -> Settings later.
      - key: AMAZON_TAG
        sync: false
      - key: FLIPKART_AFFID
        sync: false
